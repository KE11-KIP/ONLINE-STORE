<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Fashion | Online Store</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- TOP ANNOUNCEMENT BAR -->
  <div class="bg-indigo-900 text-white text-xs sm:text-sm py-2 px-4 text-center font-medium">
    <i class="fa-solid fa-truck-fast text-indigo-300 mr-2"></i> Fast & Convenient Delivery within <strong>Moi University Campus</strong>!
  </div>

  <!-- HEADER / NAVIGATION -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 sm:h-20 gap-4">
        
        <!-- LOGO -->
        <a href="#" class="flex items-center gap-2 group">
          <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-black text-xl shadow-md group-hover:scale-105 transition-transform">
            CF
          </div>
          <span class="font-extrabold text-xl sm:text-2xl tracking-tight text-slate-900">
            Campus<span class="text-indigo-600">Fashion</span>
          </span>
        </a>

        <!-- SEARCH BAR -->
        <div class="flex-1 max-w-md hidden md:block">
          <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input 
              type="text" 
              id="searchInput" 
              placeholder="Search clothes, shoes, accessories..." 
              class="w-full pl-10 pr-4 py-2 bg-slate-100 border border-transparent rounded-full text-sm focus:bg-white focus:border-indigo-500 focus:outline-none transition-all"
              oninput="handleSearch()"
            />
          </div>
        </div>

        <!-- ACTIONS: ADMIN & CART -->
        <div class="flex items-center gap-3">
          <!-- ADMIN BUTTON -->
          <button 
            type="button"
            onclick="openAdminModal()" 
            class="px-3 py-2 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors flex items-center gap-1.5 cursor-pointer z-10"
          >
            <i class="fa-solid fa-lock text-indigo-600"></i>
            <span>Admin</span>
          </button>

          <!-- CART BUTTON -->
          <button 
            type="button"
            onclick="toggleCartModal()" 
            class="relative px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm rounded-xl shadow-md transition-all flex items-center gap-2 active:scale-95 cursor-pointer"
          >
            <i class="fa-solid fa-bag-shopping text-base"></i>
            <span class="hidden sm:inline">Cart</span>
            <span id="cartCountBadge" class="bg-amber-400 text-slate-900 text-xs font-black px-2 py-0.5 rounded-full">0</span>
          </button>
        </div>

      </div>

      <!-- MOBILE SEARCH BAR -->
      <div class="pb-3 md:hidden">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input 
            type="text" 
            id="mobileSearchInput" 
            placeholder="Search items..." 
            class="w-full pl-10 pr-4 py-2 bg-slate-100 border border-transparent rounded-xl text-sm focus:bg-white focus:border-indigo-500 focus:outline-none transition-all"
            oninput="handleMobileSearch()"
          />
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT AREA -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

    <!-- DEPARTMENT & CATEGORY NAVIGATION TABS -->
    <section class="mb-8">
      <!-- DEPARTMENT TABS -->
      <div class="flex items-center justify-start sm:justify-center gap-2 overflow-x-auto pb-2 scrollbar-none">
        <button onclick="setDepartment('all')" id="dept-all" class="dept-btn active px-5 py-2.5 rounded-full font-bold text-sm whitespace-nowrap transition-all bg-indigo-600 text-white shadow-md cursor-pointer">
          All Products
        </button>
        <button onclick="setDepartment('women')" id="dept-women" class="dept-btn px-5 py-2.5 rounded-full font-bold text-sm whitespace-nowrap transition-all bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 cursor-pointer">
          <i class="fa-solid fa-venus mr-1 text-pink-500"></i> Women
        </button>
        <button onclick="setDepartment('men')" id="dept-men" class="dept-btn px-5 py-2.5 rounded-full font-bold text-sm whitespace-nowrap transition-all bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 cursor-pointer">
          <i class="fa-solid fa-mars mr-1 text-blue-500"></i> Men
        </button>
        <button onclick="setDepartment('kids')" id="dept-kids" class="dept-btn px-5 py-2.5 rounded-full font-bold text-sm whitespace-nowrap transition-all bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 cursor-pointer">
          <i class="fa-solid fa-child mr-1 text-amber-500"></i> Kids
        </button>
      </div>

      <!-- CATEGORY SUB-FILTERS -->
      <div class="mt-4 flex items-center justify-start sm:justify-center gap-2 overflow-x-auto pb-2 text-xs sm:text-sm">
        <button onclick="setCategory('all')" id="cat-all" class="cat-btn bg-slate-200 font-bold px-3.5 py-1.5 rounded-lg text-slate-800 cursor-pointer">All Categories</button>
        <button onclick="setCategory('clothing')" id="cat-clothing" class="cat-btn bg-white hover:bg-slate-100 border border-slate-200 px-3.5 py-1.5 rounded-lg text-slate-600 cursor-pointer">Clothing</button>
        <button onclick="setCategory('shoes')" id="cat-shoes" class="cat-btn bg-white hover:bg-slate-100 border border-slate-200 px-3.5 py-1.5 rounded-lg text-slate-600 cursor-pointer">Shoes</button>
        <button onclick="setCategory('bags')" id="cat-bags" class="cat-btn bg-white hover:bg-slate-100 border border-slate-200 px-3.5 py-1.5 rounded-lg text-slate-600 cursor-pointer">Bags</button>
        <button onclick="setCategory('toys')" id="cat-toys" class="cat-btn bg-white hover:bg-slate-100 border border-slate-200 px-3.5 py-1.5 rounded-lg text-slate-600 cursor-pointer">Toys</button>
        <button onclick="setCategory('accessories')" id="cat-accessories" class="cat-btn bg-white hover:bg-slate-100 border border-slate-200 px-3.5 py-1.5 rounded-lg text-slate-600 cursor-pointer">Accessories</button>
      </div>
    </section>

    <!-- PRODUCT CATALOG GRID -->
    <section>
      <div class="flex justify-between items-center mb-4">
        <h2 id="catalogTitle" class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">All Catalog</h2>
        <span id="productCount" class="text-xs sm:text-sm font-semibold text-slate-500">0 Items</span>
      </div>

      <!-- GRID CONTAINER -->
      <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 sm:gap-6">
        <!-- Dynamic JavaScript Injection -->
      </div>

      <!-- EMPTY STATE -->
      <div id="emptyState" class="hidden text-center py-16 bg-white rounded-3xl border border-dashed border-slate-300 my-4">
        <i class="fa-solid fa-box-open text-4xl text-slate-300 mb-3"></i>
        <h3 class="text-lg font-bold text-slate-700">No products found</h3>
        <p class="text-sm text-slate-500 mt-1">Try clearing your filters or search terms.</p>
